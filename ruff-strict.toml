extend = "pyproject.toml"
line-length = 88
target-version = "py314"
preview = false

[lint]
# Stable correctness, import, modernisation and simplification rules for new
# modules. Legacy task-level B-rule exemptions do not apply here.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = []

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
